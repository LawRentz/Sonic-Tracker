<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sonic Tracker</title>

<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
  }

  canvas{
    display:block;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
</head>

<body>

<script>

let cam;
let prevFrame;
let diffImg;
let haloLayer;

let motionThreshold = 45;
let minBlobPixels = 500;

let blobs = [];

// stores recent tracker positions
let trackerHistory = [];

function setup(){

  createCanvas(windowWidth, windowHeight);

  pixelDensity(1);
  frameRate(60);

  colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  cam = createCapture({
    video:{
      facingMode:{
        ideal:"environment"
      }
    },
    audio:false
  });

  cam.size(480,360);
  cam.hide();

  prevFrame =
    createImage(
      cam.width,
      cam.height
    );

  diffImg =
    createImage(
      cam.width,
      cam.height
    );

  haloLayer =
    createGraphics(
      width,
      height
    );

  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer.clear();

  textFont('monospace');
  textStyle(BOLD);
}

function draw(){

  background(0);

  blobs = [];

  cam.loadPixels();
  prevFrame.loadPixels();

  if(
    cam.pixels.length > 0 &&
    prevFrame.pixels.length > 0
  ){

    diffImg.loadPixels();

    for(
      let i = 0;
      i < cam.pixels.length;
      i += 4
    ){

      let d = dist(

        cam.pixels[i],
        cam.pixels[i+1],
        cam.pixels[i+2],

        prevFrame.pixels[i],
        prevFrame.pixels[i+1],
        prevFrame.pixels[i+2]
      );

      let v =
        d > motionThreshold
        ? 255
        : 0;

      diffImg.pixels[i]   = v;
      diffImg.pixels[i+1] = v;
      diffImg.pixels[i+2] = v;
      diffImg.pixels[i+3] = 255;
    }

    diffImg.updatePixels();

    // REAL CAMERA VIEW
    image(
      cam,
      0,
      0,
      width,
      height
    );

    blobs =
      findBlobs(
        diffImg,
        cam.width,
        cam.height
      );

    // erase old halo trails relatively quickly
    haloLayer.fill(
      0,
      0,
      0,
      52
    );

    haloLayer.noStroke();

    haloLayer.rect(
      0,
      0,
      width,
      height
    );

    let t =
      millis()/1000;

    let pulse =
      (sin(t * 1.2) + 1) / 2;

    let centers = [];

    for(
      let i = 0;
      i < blobs.length;
      i++
    ){

      let b =
        blobs[i];

      let cx = map(
        (b.minX + b.maxX)/2,
        0,
        cam.width,
        0,
        width
      );

      let cy = map(
        (b.minY + b.maxY)/2,
        0,
        cam.height,
        0,
        height
      );

      centers.push({
        x:cx,
        y:cy
      });

      /*
        Sonic Tracker palette.

        Roughly:
        cyan
        blue
        violet

        NOT random.
      */

      let hueVal =
        (
          200 +
          sin(
            t * 0.4 +
            b.minX * 0.08
          ) * 50
        ) % 360;

      /*
        SMALLER HALOS
      */

      let haloSize =
        map(
          b.count,
          minBlobPixels,
          3000,
          55,
          125
        );

      haloSize =
        constrain(
          haloSize,
          55,
          125
        );

      drawHalo(
        haloLayer,
        cx,
        cy,
        haloSize,
        hueVal,
        pulse
      );
    }

    blendMode(ADD);

    image(
      haloLayer,
      0,
      0
    );

    blendMode(BLEND);

    // MACHINE-VISION LAYERS

    drawConnectorLines(
      centers
    );

    updateTrackerHistory(
      centers
    );

    drawMotionTails();

    drawTrackers();

    prevFrame.copy(
      cam,
      0,
      0,
      cam.width,
      cam.height,
      0,
      0,
      cam.width,
      cam.height
    );
  }
}

/*
  HALO
*/

function drawHalo(
  layer,
  x,
  y,
  r,
  hueVal,
  pulse
){

  layer.push();

  layer.translate(
    x,
    y
  );

  layer.noFill();

  for(
    let i = 0;
    i < 3;
    i++
  ){

    let alpha =
      map(
        i,
        0,
        2,
        48,
        10
      );

    layer.stroke(
      hueVal,
      80,
      100,
      alpha
    );

    layer.strokeWeight(
      map(
        i,
        0,
        2,
        10,
        3
      )
    );

    layer.beginShape();

    for(
      let a = 0;
      a < TWO_PI;
      a += PI/70
    ){

      let sx =
        cos(a) *
        r *
        (
          1 +
          0.015 *
          pulse
        );

      let sy =
        sin(a) *
        r *
        (
          1 +
          0.015 *
          pulse
        );

      layer.vertex(
        sx,
        sy
      );
    }

    layer.endShape(CLOSE);

    r *= 0.82;
  }

  layer.pop();
}

/*
  CONNECT TRACKED BLOBS
*/

function drawConnectorLines(
  centers
){

  if(
    centers.length < 2
  ){
    return;
  }

  stroke(
    190,
    30,
    100,
    55
  );

  strokeWeight(1.5);

  noFill();

  for(
    let i = 0;
    i < centers.length - 1;
    i++
  ){

    line(
      centers[i].x,
      centers[i].y,
      centers[i+1].x,
      centers[i+1].y
    );
  }
}

/*
  SAVE A SHORT HISTORY
  OF TRACKER POSITIONS
*/

function updateTrackerHistory(
  centers
){

  trackerHistory.push(
    centers.map(
      p => ({
        x:p.x,
        y:p.y
      })
    )
  );

  // about 8 frames of history
  if(
    trackerHistory.length > 8
  ){
    trackerHistory.shift();
  }
}

/*
  SHORT MOVEMENT TAIL
*/

function drawMotionTails(){

  if(
    trackerHistory.length < 2
  ){
    return;
  }

  for(
    let frame = 1;
    frame < trackerHistory.length;
    frame++
  ){

    let previous =
      trackerHistory[
        frame - 1
      ];

    let current =
      trackerHistory[
        frame
      ];

    let count =
      min(
        previous.length,
        current.length
      );

    let alpha =
      map(
        frame,
        1,
        trackerHistory.length-1,
        10,
        60
      );

    stroke(
      190,
      30,
      100,
      alpha
    );

    strokeWeight(1.5);

    for(
      let i = 0;
      i < count;
      i++
    ){

      line(
        previous[i].x,
        previous[i].y,
        current[i].x,
        current[i].y
      );
    }
  }
}

/*
  TRACKER BOXES,
  CENTER TARGET,
  COORDINATES
*/

function drawTrackers(){

  for(
    let b of blobs
  ){

    let cx =
      map(
        (b.minX + b.maxX)/2,
        0,
        cam.width,
        0,
        width
      );

    let cy =
      map(
        (b.minY + b.maxY)/2,
        0,
        cam.height,
        0,
        height
      );

    let side =
      map(
        b.count,
        minBlobPixels,
        3000,
        75,
        165
      );

    side =
      constrain(
        side,
        75,
        165
      );

    let half =
      side / 2;

    /*
      TRACKER BOX
    */

    stroke(
      0,
      0,
      100,
      90
    );

    strokeWeight(1.7);

    noFill();

    rect(
      cx-half,
      cy-half,
      side,
      side,
      6
    );

    /*
      CENTER TARGET DOT
    */

    noStroke();

    fill(
      190,
      55,
      100,
      100
    );

    circle(
      cx,
      cy,
      7
    );

    /*
      SMALL CROSSHAIR
    */

    stroke(
      0,
      0,
      100,
      85
    );

    strokeWeight(1);

    line(
      cx - 12,
      cy,
      cx + 12,
      cy
    );

    line(
      cx,
      cy - 12,
      cx,
      cy + 12
    );

    /*
      COORDINATES
    */

    let label =
      `(${int(cx)}, ${int(cy)})`;

    textAlign(CENTER);

    textSize(22);

    textStyle(BOLD);

    // shadow
    fill(
      0,
      0,
      0,
      100
    );

    noStroke();

    text(
      label,
      cx + 2,
      cy - half - 13
    );

    // main white text
    fill(
      0,
      0,
      100,
      100
    );

    text(
      label,
      cx,
      cy - half - 15
    );
  }
}

/*
  FIND MOTION BLOBS
*/

function findBlobs(
  img,
  w,
  h
){

  let visited =
    new Uint8Array(
      w * h
    );

  img.loadPixels();

  let found = [];

  for(
    let y = 0;
    y < h;
    y++
  ){

    for(
      let x = 0;
      x < w;
      x++
    ){

      let idx =
        x + y*w;

      let p =
        img.pixels[
          idx*4
        ];

      if(
        p > 128 &&
        !visited[idx]
      ){

        let b =
          flood(
            x,
            y,
            visited,
            img,
            w,
            h
          );

        if(
          b.count >
          minBlobPixels
        ){
          found.push(b);
        }
      }
    }
  }

  return found;
}

/*
  FLOOD FILL
*/

function flood(
  x,
  y,
  vis,
  img,
  w,
  h
){

  let st =
    [[x,y]];

  let minX = x;
  let maxX = x;

  let minY = y;
  let maxY = y;

  let c = 0;

  while(
    st.length
  ){

    let [
      cx,
      cy
    ] =
      st.pop();

    if(
      cx < 0 ||
      cy < 0 ||
      cx >= w ||
      cy >= h
    ){
      continue;
    }

    let idx =
      cx +
      cy*w;

    if(
      vis[idx]
    ){
      continue;
    }

    let p =
      idx*4;

    if(
      img.pixels[p]
      <=
      128
    ){
      continue;
    }

    vis[idx] = 1;

    c++;

    minX =
      min(
        minX,
        cx
      );

    maxX =
      max(
        maxX,
        cx
      );

    minY =
      min(
        minY,
        cy
      );

    maxY =
      max(
        maxY,
        cy
      );

    st.push(
      [cx+1,cy],
      [cx-1,cy],
      [cx,cy+1],
      [cx,cy-1]
    );
  }

  return {
    minX,
    maxX,
    minY,
    maxY,
    count:c
  };
}

/*
  HANDLE PHONE ROTATION /
  RESIZE
*/

function windowResized(){

  resizeCanvas(
    windowWidth,
    windowHeight
  );

  haloLayer =
    createGraphics(
      width,
      height
    );

  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer.clear();

  trackerHistory = [];
}

</script>

</body>
</html>
