<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sonic Tracker</title>

<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
  }

  canvas{
    display:block;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
</head>

<body>

<script>

let cam;
let prevFrame;
let diffImg;
let haloLayer;

let motionThreshold = 45;
let minBlobPixels = 500;

let blobs = [];
let trackerHistory = [];

function setup(){

  createCanvas(windowWidth, windowHeight);

  pixelDensity(1);
  frameRate(60);

  colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  cam = createCapture({
    video:{
      facingMode:{
        ideal:"environment"
      }
    },
    audio:false
  });

  cam.size(480,360);
  cam.hide();

  prevFrame =
    createImage(
      cam.width,
      cam.height
    );

  diffImg =
    createImage(
      cam.width,
      cam.height
    );

  haloLayer =
    createGraphics(
      width,
      height
    );

  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer.clear();

  textFont('monospace');
  textStyle(BOLD);
}

function draw(){

  background(0);
  blobs = [];

  cam.loadPixels();
  prevFrame.loadPixels();

  if(
    cam.pixels.length > 0 &&
    prevFrame.pixels.length > 0
  ){

    diffImg.loadPixels();

    for(
      let i = 0;
      i < cam.pixels.length;
      i += 4
    ){

      let d = dist(

        cam.pixels[i],
        cam.pixels[i+1],
        cam.pixels[i+2],

        prevFrame.pixels[i],
        prevFrame.pixels[i+1],
        prevFrame.pixels[i+2]
      );

      let v =
        d > motionThreshold
        ? 255
        : 0;

      diffImg.pixels[i]   = v;
      diffImg.pixels[i+1] = v;
      diffImg.pixels[i+2] = v;
      diffImg.pixels[i+3] = 255;
    }

    diffImg.updatePixels();

    image(
      cam,
      0,
      0,
      width,
      height
    );

    blobs =
      findBlobs(
        diffImg,
        cam.width,
        cam.height
      );

    haloLayer.fill(
      0,
      0,
      0,
      55
    );

    haloLayer.noStroke();

    haloLayer.rect(
      0,
      0,
      width,
      height
    );

    let t =
      millis()/1000;

    let pulse =
      (sin(t * 1.2) + 1) / 2;

    let centers = [];

    for(
      let i = 0;
      i < blobs.length;
      i++
    ){

      let b =
        blobs[i];

      let cx = map(
        (b.minX + b.maxX)/2,
        0,
        cam.width,
        0,
        width
      );

      let cy = map(
        (b.minY + b.maxY)/2,
        0,
        cam.height,
        0,
        height
      );

      centers.push({
        x:cx,
        y:cy
      });

      let hueVal =
        (
          200 +
          sin(
            t * 0.4 +
            b.minX * 0.08
          ) * 50
        ) % 360;

      let haloSize =
        map(
          b.count,
          minBlobPixels,
          3000,
          45,
          105
        );

      haloSize =
        constrain(
          haloSize,
          45,
          105
        );

      drawHalo(
        haloLayer,
        cx,
        cy,
        haloSize,
        hueVal,
        pulse
      );
    }

    blendMode(ADD);

    image(
      haloLayer,
      0,
      0
    );

    blendMode(BLEND);

    drawConnectorLines(
      centers
    );

    updateTrackerHistory(
      centers
    );

    drawMotionTails();

    drawTrackers();

    prevFrame.copy(
      cam,
      0,
      0,
      cam.width,
      cam.height,
      0,
      0,
      cam.width,
      cam.height
    );
  }
}

function drawHalo(
  layer,
  x,
  y,
  r,
  hueVal,
  pulse
){

  layer.push();

  layer.translate(
    x,
    y
  );

  layer.noFill();

  for(
    let i = 0;
    i < 3;
    i++
  ){

    let alpha =
      map(
        i,
        0,
        2,
        42,
        8
      );

    layer.stroke(
      hueVal,
      80,
      100,
      alpha
    );

    layer.strokeWeight(
      map(
        i,
        0,
        2,
        8,
        2
      )
    );

    layer.beginShape();

    for(
      let a = 0;
      a < TWO_PI;
      a += PI/70
    ){

      let sx =
        cos(a) *
        r *
        (
          1 +
          0.015 *
          pulse
        );

      let sy =
        sin(a) *
        r *
        (
          1 +
          0.015 *
          pulse
        );

      layer.vertex(
        sx,
        sy
      );
    }

    layer.endShape(CLOSE);

    r *= 0.82;
  }

  layer.pop();
}

function drawConnectorLines(
  centers
){

  if(
    centers.length < 2
  ){
    return;
  }

  stroke(
    185,
    70,
    100,
    85
  );

  strokeWeight(2.5);

  for(
    let i = 0;
    i < centers.length - 1;
    i++
  ){

    line(
      centers[i].x,
      centers[i].y,
      centers[i+1].x,
      centers[i+1].y
    );

    let mx =
      (
        centers[i].x +
        centers[i+1].x
      ) / 2;

    let my =
      (
        centers[i].y +
        centers[i+1].y
      ) / 2;

    noStroke();

    fill(
      185,
      75,
      100,
      100
    );

    circle(
      mx,
      my,
      5
    );

    stroke(
      185,
      70,
      100,
      85
    );

    strokeWeight(2.5);
  }
}

function updateTrackerHistory(
  centers
){

  trackerHistory.push(
    centers.map(
      p => ({
        x:p.x,
        y:p.y
      })
    )
  );

  if(
    trackerHistory.length > 7
  ){
    trackerHistory.shift();
  }
}

function drawMotionTails(){

  if(
    trackerHistory.length < 2
  ){
    return;
  }

  for(
    let frame = 1;
    frame < trackerHistory.length;
    frame++
  ){

    let previous =
      trackerHistory[
        frame - 1
      ];

    let current =
      trackerHistory[
        frame
      ];

    let count =
      min(
        previous.length,
        current.length
      );

    let alpha =
      map(
        frame,
        1,
        trackerHistory.length-1,
        18,
        70
      );

    stroke(
      185,
      65,
      100,
      alpha
    );

    strokeWeight(2);

    for(
      let i = 0;
      i < count;
      i++
    ){

      line(
        previous[i].x,
        previous[i].y,
        current[i].x,
        current[i].y
      );
    }
  }
}

function drawTrackers(){

  for(
    let b of blobs
  ){

    let cx =
      map(
        (b.minX + b.maxX)/2,
        0,
        cam.width,
        0,
        width
      );

    let cy =
      map(
        (b.minY + b.maxY)/2,
        0,
        cam.height,
        0,
        height
      );

    let side =
      map(
        b.count,
        minBlobPixels,
        3000,
        90,
        185
      );

    side =
      constrain(
        side,
        90,
        185
      );

    let half =
      side/2;

    stroke(
      185,
      65,
      100,
      100
    );

    strokeWeight(2.8);

    noFill();

    rect(
      cx-half,
      cy-half,
      side,
      side,
      4
    );

    let corner =
      17;

    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(4);

    line(
      cx-half,
      cy-half,
      cx-half+corner,
      cy-half
    );

    line(
      cx-half,
      cy-half,
      cx-half,
      cy-half+corner
    );

    line(
      cx+half,
      cy-half,
      cx+half-corner,
      cy-half
    );

    line(
      cx+half,
      cy-half,
      cx+half,
      cy-half+corner
    );

    line(
      cx-half,
      cy+half,
      cx-half+corner,
      cy+half
    );

    line(
      cx-half,
      cy+half,
      cx-half,
      cy+half-corner
    );

    line(
      cx+half,
      cy+half,
      cx+half-corner,
      cy+half
    );

    line(
      cx+half,
      cy+half,
      cx+half,
      cy+half-corner
    );

    stroke(
      185,
      70,
      100,
      100
    );

    strokeWeight(2);

    line(
      cx-18,
      cy,
      cx+18,
      cy
    );

    line(
      cx,
      cy-18,
      cx,
      cy+18
    );

    noFill();

    stroke(
      0,
      0,
      100,
      100
    );

    strokeWeight(2);

    circle(
      cx,
      cy,
      18
    );

    noStroke();

    fill(
      185,
      70,
      100,
      100
    );

    circle(
      cx,
      cy,
      6
    );

    /*
      THICKER SCAN LINE
    */

    stroke(
      185,
      80,
      100,
      95
    );

    strokeWeight(4);

    let scanY =
      cy +
      sin(
        millis()/180
      ) *
      half *
      0.65;

    line(
      cx-half+10,
      scanY,
      cx+half-10,
      scanY
    );

    let label =
      `TRACK  (${int(cx)}, ${int(cy)})`;

    textAlign(
      CENTER,
      CENTER
    );

    textSize(20);
    textStyle(BOLD);

    let labelWidth =
      textWidth(label) + 18;

    let labelHeight =
      30;

    let labelY =
      cy-half-28;

    noStroke();

    fill(
      0,
      0,
      0,
      72
    );

    rect(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      labelWidth,
      labelHeight,
      3
    );

    stroke(
      185,
      75,
      100,
      100
    );

    strokeWeight(2);

    line(
      cx-labelWidth/2,
      labelY-labelHeight/2,
      cx+labelWidth/2,
      labelY-labelHeight/2
    );

    noStroke();

    fill(
      0,
      0,
      100,
      100
    );

    text(
      label,
      cx,
      labelY
    );
  }
}

function findBlobs(
  img,
  w,
  h
){

  let visited =
    new Uint8Array(
      w*h
    );

  img.loadPixels();

  let found = [];

  for(
    let y = 0;
    y < h;
    y++
  ){

    for(
      let x = 0;
      x < w;
      x++
    ){

      let idx =
        x+y*w;

      let p =
        img.pixels[
          idx*4
        ];

      if(
        p > 128 &&
        !visited[idx]
      ){

        let b =
          flood(
            x,
            y,
            visited,
            img,
            w,
            h
          );

        if(
          b.count >
          minBlobPixels
        ){
          found.push(b);
        }
      }
    }
  }

  return found;
}

function flood(
  x,
  y,
  vis,
  img,
  w,
  h
){

  let st =
    [[x,y]];

  let minX = x;
  let maxX = x;

  let minY = y;
  let maxY = y;

  let c = 0;

  while(
    st.length
  ){

    let [
      cx,
      cy
    ] =
      st.pop();

    if(
      cx < 0 ||
      cy < 0 ||
      cx >= w ||
      cy >= h
    ){
      continue;
    }

    let idx =
      cx+cy*w;

    if(
      vis[idx]
    ){
      continue;
    }

    let p =
      idx*4;

    if(
      img.pixels[p] <= 128
    ){
      continue;
    }

    vis[idx] = 1;

    c++;

    minX =
      min(
        minX,
        cx
      );

    maxX =
      max(
        maxX,
        cx
      );

    minY =
      min(
        minY,
        cy
      );

    maxY =
      max(
        maxY,
        cy
      );

    st.push(
      [cx+1,cy],
      [cx-1,cy],
      [cx,cy+1],
      [cx,cy-1]
    );
  }

  return {
    minX,
    maxX,
    minY,
    maxY,
    count:c
  };
}

function windowResized(){

  resizeCanvas(
    windowWidth,
    windowHeight
  );

  haloLayer =
    createGraphics(
      width,
      height
    );

  haloLayer.colorMode(
    HSB,
    360,
    100,
    100,
    100
  );

  haloLayer.clear();

  trackerHistory = [];
}

</script>

</body>
</html>
